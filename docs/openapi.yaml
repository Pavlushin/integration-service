openapi: 3.1.0
info:
  title: OneC Integration Service API
  version: 0.1.0
  description: >
    HTTP API for starting heavy integration jobs, inspecting DLQ state,
    requeueing DLQ jobs, and reading runtime observability counters.
servers:
  - url: http://127.0.0.1:8080
    description: Local Docker stack
tags:
  - name: health
  - name: heavy-requests
  - name: dlq
  - name: observability
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe.
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [health]
      summary: Readiness probe.
      responses:
        "200":
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Dependency is unavailable.
  /integration/api/v1/users:
    post:
      tags: [heavy-requests]
      summary: Start worksheets export heavy request.
      description: >
        Creates or reuses a prepare job for the requested date range. The
        dedupe key is `worksheets_export_test:{date_from}:{date_to}`.
        Active jobs and successfully completed `done` jobs are reused and
        returned with `reused=true`. Terminal unsuccessful jobs (`dlq`,
        `failed`) are not reused, so a repeated request can create a new job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorksheetsExportRequest"
            examples:
              default:
                value:
                  date_from: "2026-06-01"
                  date_to: "2026-06-02"
      responses:
        "202":
          description: Heavy request was accepted or deduplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeavyStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /integration/api/v1/dlq/jobs:
    get:
      tags: [dlq]
      summary: List DLQ jobs.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Defaults to 20 and is capped at 100.
      responses:
        "200":
          description: DLQ jobs ordered from newest to oldest.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /integration/api/v1/dlq/jobs/{job_id}/requeue:
    post:
      tags: [dlq]
      summary: Requeue one DLQ job.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
            examples:
              manualRetry:
                value:
                  reason: "Manual retry after product API recovery"
      responses:
        "202":
          description: DLQ job was reset to retrying and enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQRequeueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /integration/api/v1/dlq/jobs/{job_id}/audit:
    get:
      tags: [dlq]
      summary: List audit records for one job.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Defaults to 20 and is capped at 100.
      responses:
        "200":
          description: Audit records ordered from newest to oldest.
          content:
            application/json:
              schema:
                type: object
                required: [audit]
                properties:
                  audit:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /integration/api/v1/observability/metrics:
    get:
      tags: [observability]
      summary: Read lightweight runtime counters.
      responses:
        "200":
          description: Snapshot of job statuses and outbox counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityMetrics"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    Actor:
      name: X-Actor
      in: header
      required: false
      schema:
        type: string
      description: Operator identity recorded in the DLQ audit log.
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Stored on the created job. Current reuse behavior is driven by dedupe key.
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request payload, path parameter, or query parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal service error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AuditRecord:
      type: object
      required: [id, job_id, action, actor, reason, metadata_json, created_at]
      properties:
        id:
          type: string
        job_id:
          type: string
        action:
          type: string
          examples: [dlq_requeue]
        actor:
          type: string
        reason:
          type: string
        metadata_json:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    DLQRequeueResponse:
      type: object
      required: [job_id, status, requeued]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [retrying]
        requeued:
          type: boolean
    ErrorResponse:
      type: object
      required: [message, error]
      properties:
        message:
          type: string
        error:
          type: string
    HealthResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string
    HeavyStartResponse:
      type: object
      required: [job_id, correlation_id, reused]
      properties:
        job_id:
          type: string
        correlation_id:
          type: string
        reused:
          type: boolean
    Job:
      type: object
      required:
        - id
        - correlation_id
        - type
        - kind
        - direction
        - status
        - dedupe_key
        - attempts
        - last_error
        - created_at
      properties:
        id:
          type: string
        correlation_id:
          type: string
        parent_id:
          type: string
        type:
          type: string
        kind:
          type: string
          enum: [prepare, delivery]
        direction:
          type: string
          enum: [inbound, outbound]
        status:
          type: string
          enum: [received, validated, prepared, delivering, done, retrying, failed, dlq]
        dedupe_key:
          type: string
        attempts:
          type: integer
        last_error:
          type: string
        result_path:
          type: string
        created_at:
          type: string
          format: date-time
    ObservabilityMetrics:
      type: object
      required: [jobs_by_status, outbox]
      properties:
        jobs_by_status:
          type: object
          additionalProperties:
            type: integer
        outbox:
          type: object
          required: [pending, delayed, failed]
          properties:
            pending:
              type: integer
            delayed:
              type: integer
            failed:
              type: integer
    WorksheetsExportRequest:
      type: object
      required: [date_from, date_to]
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
