name: onec-integration

services:
  api:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: Dockerfile
      args:
        SERVICE: api
    depends_on:
      jaeger:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ${PROJECT_ROOT}/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ${PROJECT_ROOT}/out:/app/out
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  worker:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: Dockerfile
      args:
        SERVICE: worker
    depends_on:
      jaeger:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ${PROJECT_ROOT}/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ${PROJECT_ROOT}/out:/app/out
    restart: unless-stopped

  worker-e2e:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: Dockerfile
      args:
        SERVICE: worker
    profiles: ["e2e"]
    depends_on:
      jaeger:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      fake-product-api:
        condition: service_started
    env_file:
      - ${PROJECT_ROOT}/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PRODUCT_API_BASE_URL: http://fake-product-api:8081
      PRODUCT_API_BEARER_TOKEN: local-fake-token
      PRODUCT_API_TIMEOUT: 10s
      WORKSHEETS_EXPORT_SOURCE: disabled
    volumes:
      - ${PROJECT_ROOT}/out:/app/out
    restart: unless-stopped

  fake-product-api:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: Dockerfile
      args:
        SERVICE: fake-product-api
    profiles: ["e2e"]
    ports:
      - "127.0.0.1:${FAKE_PRODUCT_API_PORT:-18081}:8081"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-migrate:
    image: migrate/migrate:v4.19.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        migrate
        -path=/migrations
        -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
        up

  postgres-port-forwarder:
    image: alpine/socat:1.8.0.3
    profiles: ["forwarders"]
    depends_on:
      postgres:
        condition: service_started
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:${POSTGRES_FORWARD_PORT:-5432}:5432"

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_MQ_PASS}
    volumes:
      - ${PROJECT_ROOT}/out/rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq-port-forwarder:
    image: alpine/socat:1.8.0.3
    profiles: ["forwarders"]
    depends_on:
      rabbitmq:
        condition: service_started
    command: tcp-listen:5672,fork,reuseaddr tcp-connect:rabbitmq:5672
    ports:
      - "127.0.0.1:${RABBIT_MQ_FORWARD_PORT:-5672}:5672"

  rabbitmq-management-forwarder:
    image: alpine/socat:1.8.0.3
    profiles: ["forwarders"]
    depends_on:
      rabbitmq:
        condition: service_started
    command: tcp-listen:15672,fork,reuseaddr tcp-connect:rabbitmq:15672
    ports:
      - "127.0.0.1:${RABBIT_MQ_MANAGEMENT_PORT:-15672}:15672"
